# The deploy server's traefik terminates TLS and sends stiriri.dev/api/* to the backend,
# so this container only serves the built SPA.
server {
    listen 8080;
    root /usr/share/nginx/html;

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # Vite emits content-hashed files under /assets.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback: client-side routes load index.html.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
